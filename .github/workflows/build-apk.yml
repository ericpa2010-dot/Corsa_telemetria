name: Compilar APK Flutter Corsa Telemetria

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Obter dependencias
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --split-per-abi=false

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: CorsaTelemetria-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
