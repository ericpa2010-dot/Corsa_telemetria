name: Compilar APK Flutter Corsa Telemetria

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias do Flutter
        run: flutter pub get

      - name: Gerar o APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: CorsaTelemetria-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
